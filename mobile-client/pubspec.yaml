name: app_portal_sekolah
description: "Aplikasi Portal Sekolah Mobile Client berbasis Flutter Native."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Manajemen State Profesional & Service Locator
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  
  # Koneksi Network & Http Client ke Laravel API
  dio: ^5.4.0
  
  # Penyimpanan Enkripsi Lokal (Token JWT/Sanctum Laravel)
  flutter_secure_storage: ^9.0.0
  
  # Komponen UI Tambahan & Icon Google
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
